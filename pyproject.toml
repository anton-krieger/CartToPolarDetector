[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "CartToPolarDetector"
version = "0.1.0"
description = "A package to convert a cartesian detector grid into a polar detector grid taking into account the various possible cross section areas of cartesian and polar pixels."
readme = "README.md"
license = {text = "MIT"}
authors = [
	{name = "Anton Krieger", email = "akrieger@astrophysik.uni-kiel.de"},
]
requires-python = ">=3.9"
dependencies = [
	"numpy",
]
keywords = [
	"astronomy",
	"astrophysics",
	"detector",
	"cartesian",
	"polar",
	"coordinate-conversion",
	"regridding",
	"resampling",
]
classifiers = [
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Intended Audience :: Science/Research",
	"Topic :: Scientific/Engineering :: Astronomy",
	"Topic :: Scientific/Engineering :: Physics",
	"Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/anton-krieger/CartToPolarDetector"
Documentation = "https://github.com/anton-krieger/CartToPolarDetector#readme"
Issues = "https://github.com/anton-krieger/CartToPolarDetector/issues"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["CartToPolarDetector"]
